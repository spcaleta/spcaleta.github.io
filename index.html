<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd200">
<title>Sporting La Caleta</title>
<meta name="description" content="Calendario, resultados y clasificación del Sporting La Caleta en la Liga de Fútbol Sala Ciudad de Tomares, 3ª División 2026/27.">
<link rel="icon" type="image/png" href="img/escudo-64.png">
<link rel="apple-touch-icon" href="img/escudo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: marcador de pabellón — bloque amarillo de club arriba, pestañas, filas de partido tipo acta */
:root{
  --ink:#0c0c09; --panel:#16150f; --panel2:#1e1c13; --line:#2e2b1b;
  --yellow:#ffd200; --yellow-dim:#b89a12; --text:#f4f0e0; --muted:#a39e85;
  --win:#5fd38d; --loss:#ff6f5e; --draw:#cfc8a6;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.demo{background:var(--panel2);color:var(--muted);font-size:13px;text-align:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.demo b{color:var(--yellow)}

/* Cabecera: negra y compacta, con las líneas de una pista de fútbol sala; el amarillo es el acento */
.hero{background:radial-gradient(120% 140% at 85% 0,#2a260f 0,var(--ink) 55%);color:var(--text);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.hero .court{position:absolute;inset:0;width:100%;height:100%;color:rgba(255,210,0,.07);pointer-events:none}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:8px;
  background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,var(--ink) 12px 24px)}
.hero-in{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,400px);gap:24px;align-items:center;padding-block:26px 36px}
.hero-photo{margin:0;border-radius:6px;overflow:hidden;box-shadow:0 0 0 3px var(--yellow),0 16px 34px rgba(0,0,0,.55);transform:rotate(1.5deg);aspect-ratio:4/3;max-width:100%}
.hero-photo img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.crest{width:112px;height:112px;flex:none;border-radius:50%;background:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 3px var(--yellow),0 12px 30px rgba(0,0,0,.5)}
.crest img{height:88px;width:auto}
.mini{height:1.15em;width:auto;vertical-align:-.2em;margin-right:6px}
.hero-txt{min-width:0;position:relative}
.kicker{display:inline-block;font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--yellow);margin-bottom:6px}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(40px,7vw,68px);line-height:.9;margin:0;letter-spacing:.5px;text-transform:uppercase;text-wrap:balance}
.hero h1 span{color:var(--yellow)}
.hero p{margin:10px 0 0;font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:820px){.hero-in{grid-template-columns:auto minmax(0,1fr)}.hero-photo{grid-column:1/-1;transform:none;margin-top:4px}}
@media (max-width:520px){.hero-in{gap:14px;padding-block:20px 30px}}

/* Escudos de rivales: escudo con iniciales */
.bdg{--c:#555;display:inline-grid;place-items:center;flex:none;width:1.6em;height:1.85em;background:var(--c);color:#fff;font:800 .72em/1 var(--f-display);letter-spacing:.02em;clip-path:polygon(50% 0,100% 14%,100% 58%,50% 100%,0 58%,0 14%);vertical-align:middle}
.bdg.us{background:none;clip-path:none;width:auto;display:inline-block}
.bdg.us img{display:block;height:1.85em;width:auto;max-width:none}
.tm{display:inline-flex;align-items:center;gap:8px;min-width:0}
.tm span{min-width:0;overflow-wrap:anywhere}
.h .tm{flex-direction:row-reverse}

/* Tabs */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);border-bottom:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.35)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
@media (max-width:520px){nav .wrap{gap:0}nav button{font-size:13px;padding:15px 7px;letter-spacing:.04em}.hero-photo{aspect-ratio:16/10}}
nav button{font:700 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:none;border:0;color:var(--muted);padding:16px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--yellow);border-color:var(--yellow)}
nav button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
nav .lock{margin-left:auto}

main{padding-block:24px 60px}
h2{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:28px;letter-spacing:.03em;margin:0 0 14px}
h3{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:20px;letter-spacing:.04em;margin:0}
.box>.jhead h3::before,h2.sec::before{content:"";display:inline-block;width:6px;height:.8em;background:var(--yellow);transform:skewX(-14deg);margin-right:10px;vertical-align:-.04em}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Próximo partido: cartel de jornada */
.matchday{position:relative;overflow:hidden;border-radius:6px;background:linear-gradient(135deg,var(--panel2),var(--ink) 70%);border:1px solid var(--line);box-shadow:inset 0 4px 0 var(--yellow)}
.matchday::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent 0 22px,rgba(255,210,0,.035) 22px 44px);pointer-events:none}
.md-top{position:relative;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line)}
.md-top .label:first-child{color:var(--yellow)}
.md-teams{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:16px;align-items:center;padding:26px 20px 18px;text-align:center}
.md-team{display:grid;justify-items:center;gap:10px;min-width:0}
.md-team .bdg{font-size:44px}
.md-team b{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,3.4vw,28px);text-transform:uppercase;line-height:1.02;overflow-wrap:anywhere;text-wrap:balance}
.md-team.us b{color:var(--yellow)}
.md-team small{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.md-mid{display:grid;justify-items:center;gap:6px}
.md-date{font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;background:var(--yellow);color:var(--ink);padding:4px 8px;border-radius:2px}
.md-time{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,6vw,52px);line-height:1;font-variant-numeric:tabular-nums}
.md-vs{font-family:var(--f-display);font-weight:900;color:var(--yellow);font-size:16px;letter-spacing:.2em}
.md-count{position:relative;display:flex;justify-content:center;gap:8px;padding:0 20px 22px}
.md-count div{min-width:70px;background:var(--ink);border:1px solid var(--line);border-radius:3px;padding:8px 6px;text-align:center}
.md-count b{display:block;font-family:var(--f-display);font-weight:900;font-size:30px;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums}
.md-count span{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.md-teams{gap:8px;padding:20px 12px 14px}.md-team .bdg{font-size:32px}.md-count div{min-width:58px}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:24px;margin-top:24px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
/* Secciones: titular grande y aire; las cajas solo para la clasificación */
.sech{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:40px 0 14px}
.sech h2{margin:0}
h2.sec::before{content:"";display:inline-block;width:7px;height:.78em;background:var(--yellow);transform:skewX(-14deg);margin-right:12px;vertical-align:-.02em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:0 32px}
/* Temporada en una franja de marcador */
.season{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-block:1px solid var(--line)}
.season div{padding:16px 10px;display:grid;gap:6px;justify-items:center;text-align:center;border-left:1px solid var(--line);min-width:0}
.season div:first-child{border-left:0}
.season b{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.4vw,42px);line-height:1;font-variant-numeric:tabular-nums}
.season span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.season .form{min-height:30px;align-items:center}
@media (max-width:640px){.season{grid-template-columns:repeat(3,minmax(0,1fr))}.season div:nth-child(4){border-left:0}.season div:nth-child(n+4){border-top:1px solid var(--line)}}
/* Goleadores */
.goles{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.goles li{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(60px,34%) 36px;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.goles li.top{border-color:var(--yellow-dim);background:linear-gradient(90deg,rgba(255,210,0,.10),var(--panel) 70%)}
.goles .gp{font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.goles .gn{font-weight:700;min-width:0;overflow-wrap:anywhere}
.goles .gn em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;background:var(--yellow);color:var(--ink);padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:2px}
.goles .gb{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.goles .gb i{display:block;height:100%;background:var(--yellow)}
.goles b{font-family:var(--f-display);font-weight:900;font-size:26px;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.gedit{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:8px}
.grow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:6px 6px 6px 12px;font-weight:600}
.grow input{width:64px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:18px;padding:6px}
/* Tarjetas de marcador */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.mc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px 14px;display:grid;gap:12px;min-width:0}
.mc.W{box-shadow:inset 0 3px 0 var(--win)}.mc.L{box-shadow:inset 0 3px 0 var(--loss)}.mc.D{box-shadow:inset 0 3px 0 var(--draw)}.mc.next{box-shadow:inset 0 3px 0 var(--yellow)}
.mc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mc-ln{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.mc-t{display:grid;justify-items:center;gap:6px;text-align:center;min-width:0;font-weight:700;font-size:14px;line-height:1.15}
.mc-t .bdg{font-size:30px}
/* Camiseta de cada equipo en los enfrentamientos */
.kit{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.kit svg{width:16px;height:16px;flex:none}
.md-team .kit{font-size:12px}.md-team .kit svg{width:20px;height:20px}
.mrow .kit{margin-left:4px;vertical-align:-3px}
.mc-t.us{color:var(--yellow)}
.mc-sc{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.mc-sc.t{font-size:24px;color:var(--text)}
.res{font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:2px;color:var(--ink)}
.res.W{background:var(--win)}.res.D{background:var(--draw)}.res.L{background:var(--loss)}.res.N{background:var(--yellow)}
.empty-note{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:6px}
/* Match rows */
.mrow{display:grid;grid-template-columns:86px minmax(0,1fr) 64px minmax(0,1fr);gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);font-size:14px}
.mrow:first-child{border-top:0}
.mrow .when{color:var(--muted);font-size:12px;line-height:1.25;font-variant-numeric:tabular-nums}
.mrow .when b{color:var(--text);font-weight:600;display:block}
.mrow .h{text-align:right;display:flex;justify-content:flex-end}
.mrow .h,.mrow .a{min-width:0;overflow-wrap:anywhere;font-weight:500}
.score{font-family:var(--f-display);font-weight:800;font-size:20px;text-align:center;background:var(--panel2);border-radius:3px;padding:3px 0;font-variant-numeric:tabular-nums}
.score.pend{color:var(--muted);font-size:14px;font-family:var(--f-body);font-weight:600}
.mrow.ours{background:rgba(255,210,0,.06);box-shadow:inset 3px 0 0 var(--yellow)}
.ours-name{color:var(--yellow);font-weight:700!important}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--loss);color:var(--ink)}

.jhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.jcard{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 14px 6px;margin-bottom:14px}
.jcard.done .jhead h3::after{content:" ✓";color:var(--win)}
.brk{display:flex;gap:10px;align-items:center;margin:4px 0 18px;color:var(--muted);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.brk::before,.brk::after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--yellow-dim) 0 6px,transparent 6px 12px)}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{accent-color:var(--yellow);width:18px;height:18px}

/* Table */
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:560px}
table.compact{min-width:0}
table.compact td.l{overflow-wrap:anywhere}
tr.lead td.pos{color:var(--yellow)}
td.pos{position:relative}
th{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:8px 6px;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
td{text-align:center;padding:10px 6px;border-bottom:1px solid var(--line)}
td.pts{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--yellow)}
td.pos{font-family:var(--f-display);font-weight:800;font-size:18px;width:36px}
tr.ours td{background:rgba(255,210,0,.08)}
tr.ours td.l{color:var(--yellow);font-weight:700}
.form{display:flex;gap:3px;justify-content:center}
.form i{width:18px;height:18px;border-radius:2px;font:700 11px/18px var(--f-body);font-style:normal;color:var(--ink)}
.form .W{background:var(--win)}.form .D{background:var(--draw)}.form .L{background:var(--loss)}
.legend{color:var(--muted);font-size:13px;margin-top:10px}

/* Forms / admin */
input,select{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.btn{font:800 15px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:var(--yellow);color:var(--ink);border:0;border-radius:3px;padding:12px 16px;cursor:pointer}
.btn.ghost{background:none;color:var(--yellow);border:1px solid var(--yellow)}
.btn.danger{background:none;color:var(--loss);border:1px solid var(--loss)}
.login{max-width:380px;display:grid;gap:12px}
.login .err{color:var(--loss);font-size:14px}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.arow .teams{font-weight:600;min-width:0;overflow-wrap:anywhere}
.arow .fields{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.arow input[type=number]{width:58px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:18px;padding:6px}
.arow input[type=date]{width:150px}.arow input[type=time]{width:100px}
@media (max-width:640px){.arow{grid-template-columns:1fr}.arow .fields{justify-content:flex-start}}
.confirm{background:var(--panel2);border:1px solid var(--loss);padding:12px;border-radius:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:3px;z-index:20}
.note{color:var(--muted);font-size:13px;max-width:65ch}
@media (max-width:520px){
  .mrow{grid-template-columns:64px 1fr 52px 1fr;gap:6px;font-size:13px}
  .crest{width:72px;height:72px}
  .crest img{height:56px}
  .big-crest{height:48px}
}
/* Month view */
.seg{display:flex;border:1px solid var(--yellow);border-radius:3px;overflow:hidden}
.seg button{font:800 14px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;background:none;color:var(--yellow);border:0;padding:9px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--yellow);color:var(--ink)}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.mtitle{font-size:26px}
.nav-m{font-size:24px;padding:6px 14px}
.nav-m:disabled{opacity:.3;cursor:default}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font:700 13px/1 var(--f-display);letter-spacing:.1em;color:var(--muted);padding:6px 0}
.day{min-height:96px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px;text-align:left;cursor:pointer;color:var(--text);font:inherit;display:flex;flex-direction:column;align-items:stretch;gap:4px;min-width:0}
.day.empty{background:none;border:0;cursor:default}
.day .n{font:800 17px/1 var(--f-display);font-variant-numeric:tabular-nums;align-self:flex-start}
.day.wknd .n{color:var(--muted)}
.day.today .n{background:var(--text);color:var(--ink);border-radius:2px;padding:2px 4px}
.day.brk-day{background:repeating-linear-gradient(-45deg,var(--panel) 0 6px,var(--panel2) 6px 12px)}
.day.sel{outline:2px solid var(--yellow);outline-offset:-1px}
.day.has-ours{border-color:var(--yellow-dim)}
.chip{background:var(--yellow);color:var(--ink);border-radius:2px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.15;min-width:0}
.chip .opp{font-weight:700;overflow-wrap:anywhere}
.chip .ct{font:800 14px/1 var(--f-display);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.rs{font:700 10px/1 var(--f-body);padding:2px 3px;border-radius:2px;color:var(--ink)}
.rs.W{background:var(--win)}.rs.L{background:var(--loss)}.rs.D{background:var(--draw)}
.chip .rs{outline:1px solid var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:3px;align-items:center;margin-top:auto}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted)}
.dots em{font-style:normal;font-size:11px;color:var(--muted);margin-left:2px}
.blab{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--yellow-dim);margin-top:auto}
.mlegend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;color:var(--muted);font-size:13px}
.mlegend span{display:flex;align-items:center;gap:6px}
.lg-chip{width:14px;height:10px;background:var(--yellow);border-radius:2px}
.lg-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.lg-brk{width:14px;height:10px;border:1px solid var(--line);background:repeating-linear-gradient(-45deg,var(--panel) 0 3px,var(--panel2) 3px 6px)}
@media (max-width:640px){
  .mgrid{gap:2px}
  .day{min-height:68px;padding:3px;gap:3px}
  .day .n{font-size:14px}
  .chip{padding:2px 3px;font-size:9.5px}
  .chip .ct{font-size:11px}
  .dots em,.blab{display:none}
  .dots i{width:5px;height:5px}
  .day.brk-day .n{color:var(--yellow-dim)}
}
.ig{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-weight:700;font-size:14px;letter-spacing:.04em;color:var(--yellow);background:none;border:1px solid var(--yellow-dim);padding:7px 12px;border-radius:3px;text-decoration:none}
.ig svg{width:18px;height:18px}
.ig:hover{text-decoration:underline}
.foot{border-top:4px solid var(--yellow);background:var(--panel);color:var(--muted);font-size:14px}
.foot-club{display:flex;gap:12px;align-items:center}
.foot-club img{height:44px;width:auto}
.foot-club b{display:block;color:var(--text);font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.04em}
.foot .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;justify-content:space-between;align-items:center;padding-block:22px}
.foot a{color:var(--yellow);font-weight:600}
/* Gestión económica (zona privada) */
.subnav{margin-bottom:18px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:900;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v.y{color:var(--yellow)}.kpi .v.ok{color:var(--win)}.kpi .v.ko{color:var(--loss)}
.kpi .s{color:var(--muted);font-size:13px}
.ledger{width:100%;min-width:0;border-collapse:collapse}
.ledger td{text-align:left;padding:10px 4px;border-bottom:1px solid var(--line)}
.ledger td.amt{text-align:right;font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ledger td.amt.in{color:var(--win)}.ledger td.amt.out{color:var(--loss)}
.ledger tr.tot td{border-bottom:0;border-top:2px solid var(--yellow-dim);font-weight:700}
.ledger tr.tot td.amt{color:var(--yellow);font-size:22px}
.ledger .src{display:block;color:var(--muted);font-size:12px}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .nm{font-weight:600;overflow-wrap:anywhere}
.prow .ix{font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.paychk{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:3px;padding:6px 10px;color:var(--loss);user-select:none}
.paychk input{accent-color:var(--win);width:20px;height:20px;margin:0}
.paychk.paid{color:var(--win);border-color:var(--win);background:rgba(95,211,141,.08)}
.payer{display:grid;justify-items:end;gap:2px;border-radius:3px;padding:7px 10px;background:var(--yellow);color:var(--ink);text-align:right}
.payer b{font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.payer span{font-size:12px;font-weight:600}
.payer.done{background:var(--win)}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--win)}
@media (prefers-reduced-motion:no-preference){.tab{animation:in .25s ease}}
@keyframes in{from{transform:translateY(4px)}to{transform:none}}
</style>
</head>

<main class="wrap" id="main"></main>
<footer class="foot"><div class="wrap"><div class="foot-club"><img src="img/escudo-64.png" alt="" width="40" height="51"><div><b>Sporting de La Caleta</b><span>Fútbol sala · Tomares (Sevilla) · 3ª División 2026/27</span></div></div><a href="https://www.instagram.com/spcaleta/" target="_blank" rel="noopener">Síguenos en Instagram · @spcaleta</a></div></footer>

<script>
const US="SLC",REPO="spcaleta/spcaleta.github.io",DPATH="data/partidos.json",API="https://api.github.com/repos/"+REPO;
const BCOL=["#3d6fb3","#a8453b","#2f8a6a","#7a4fa0","#b5762a","#3b8a96","#8a3f66","#5b6b2e","#4d5a70","#9a5b3c","#2e6e48"];
function initials(name){
  const w=name.split(/\s+/).filter(x=>!/^(FS|CF|CD|UD|FC|La|El|del|de|Club|\d+)$/i.test(x));
  const ws=w.length?w:name.split(/\s+/);
  return (ws.length>1?ws[0][0]+ws[1][0]:ws[0].slice(0,2)).toUpperCase();
}
// Escudos reales de los rivales que tenemos (el resto lleva el escudo con iniciales)
const ESCUDOS={VIV:"img/rivales/vividores.png"};
// Color de la camiseta de cada equipo (colores: uno liso o varios en rayas; Mashuca tiene dos equipaciones)
const CAMISETAS={
  DIS:[{t:"Verde claro",c:["#8fd16a"]}], SIT:[{t:"Negra",c:["#111"]}], ROY:[{t:"Verde",c:["#1f9a4a"]}],
  NAS:[{t:"Morado claro",c:["#b58ce0"]}], BOM:[{t:"Negra",c:["#111"]}], VIV:[{t:"Negra",c:["#111"]}],
  GAL:[{t:"Blanca",c:["#f4f4f4"]}], CRA:[{t:"Naranja",c:["#f28c28"]}], QUI:[{t:"Azul",c:["#2a6fdb"]}],
  HAR:[{t:"Roja y negra",c:["#d4232b","#111"]}], MAS:[{t:"1ª verde",c:["#1f9a4a"]},{t:"2ª morada",c:["#7b3fb0"]}],
  SLC:[{t:"Negra",c:["#111"]}]
};
let kitN=0;
function shirt(c){
  const id="k"+(++kitN),n=c.length;
  const fill=n>1?`url(#${id})`:c[0];
  const grad=n>1?`<defs><linearGradient id="${id}" x2="1">${[0,1,2,3,4,5].map(i=>`<stop offset="${i/6}" stop-color="${c[i%n]}"/><stop offset="${(i+1)/6}" stop-color="${c[i%n]}"/>`).join("")}</linearGradient></defs>`:"";
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${grad}<path d="M8 3 3.5 5.5 1.5 10l3.5 1.6L6 10v11h12V10l1 1.6 3.5-1.6-2-4.5L16 3c-.6 1.5-2.1 2.4-4 2.4S8.6 4.5 8 3Z" fill="${fill}" stroke="#a39e85" stroke-width="1.1" stroke-linejoin="round"/></svg>`;
}
function camiseta(k,soloIcono){
  const ks=CAMISETAS[k];if(!ks)return "";
  const txt=ks.map(x=>x.t).join(" · ");
  return `<span class="kit" title="Camiseta: ${esc(txt)}">${ks.map(x=>shirt(x.c)).join("")}${soloIcono?"":esc(txt)}</span>`;
}
function badge(k){
  if(k===US)return '<span class="bdg us"><img src="img/escudo-64.png" alt=""></span>';
  if(ESCUDOS[k])return `<span class="bdg us"><img src="${ESCUDOS[k]}" alt=""></span>`;
  const i=Object.keys(T).filter(x=>x!==US).indexOf(k);
  return `<span class="bdg" style="--c:${BCOL[(i<0?0:i)%BCOL.length]}" aria-hidden="true">${esc(initials(T[k]||k))}</span>`;
}
const tm=(k,name)=>`<span class="tm">${badge(k)}<span>${esc(name??T[k])}</span></span>`;
let DATA=null,T={},STARTS=[],BREAK_R=[],MATCHES=[];
function setData(d){DATA=d;T=d.equipos;STARTS=d.jornadas.map(x=>x.inicio);BREAK_R=d.descansos;MATCHES=d.partidos}
const addDays=(iso,d)=>{const[y,m,dd]=iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,dd+d)).toISOString().slice(0,10)};
const M=()=>MATCHES;
const played=m=>m.hg!==null&&m.hg!==""&&m.ag!==null&&m.ag!==""&&!m.post;
const fmt=(iso,o={weekday:"short",day:"numeric",month:"short"})=>new Date(iso+"T12:00:00").toLocaleDateString("es-ES",o);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const BREAKS=()=>BREAK_R.map(b=>({after:STARTS.filter(s=>s<=b.from).length,t:`${fmt(b.from,{day:"numeric",month:"short"})} – ${fmt(b.to,{day:"numeric",month:"short"})} · ${b.t}`}));
let authed=false, filterOurs=false, adminJ=null, saving=false, loginErr="", adminView="partidos";
let token=null;try{token=localStorage.getItem("slc-token")}catch(e){}
const hdr=(x={})=>Object.assign({Authorization:"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"},x);
const b64=s=>{let bin="";new TextEncoder().encode(s).forEach(c=>bin+=String.fromCharCode(c));return btoa(bin)};
async function load(fresh){
  let d;
  if(fresh&&token){const r=await fetch(API+"/contents/"+DPATH,{headers:hdr({Accept:"application/vnd.github.raw+json"}),cache:"no-store"});if(!r.ok)throw new Error("GitHub "+r.status);d=await r.json()}
  else{const r=await fetch(DPATH+"?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);d=await r.json()}
  setData(d);
}
async function apiGet(path){
  const r=await fetch(API+"/contents/"+path,{headers:hdr(),cache:"no-store"});
  if(!r.ok)throw new Error(r.status===404?"Todavía no existe "+path+" en el repositorio.":"No se pudo leer "+path+" ("+r.status+").");
  const j=await r.json(),bin=atob(j.content.replace(/\n/g,""));
  return {obj:JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))),sha:j.sha};
}
async function apiPut(path,obj,sha,msg){
  const r=await fetch(API+"/contents/"+path,{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify({message:msg,content:b64(JSON.stringify(obj,null,1)+"\n"),sha})});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message}catch(e){}throw new Error("GitHub rechazó el guardado: "+m)}
  return (await r.json()).content.sha;
}
// ---------- Goleadores: data/goleadores.json (se lee en público; se edita con la clave) ----------
const GPATH="data/goleadores.json";
let GOLES=null,golSha=null,golErr="";
async function loadGolesPublico(){try{const r=await fetch(GPATH+"?v="+Date.now(),{cache:"no-store"});if(r.ok)GOLES=await r.json()}catch(e){}}
async function loadGolesAdmin(){golErr="";try{const g=await apiGet(GPATH);GOLES=g.obj;golSha=g.sha}catch(e){golErr=e.message}}
function goleadoresHTML(){
  if(!GOLES)return "";
  const js=GOLES.jugadores.filter(j=>j.goles>0).sort((a,b)=>b.goles-a.goles||a.nombre.localeCompare(b.nombre));
  if(!js.length)return `<p class="empty-note">Todavía no hay goles apuntados.</p>`;
  const max=js[0].goles;
  return `<ol class="goles">${js.map((j,i)=>`<li class="${j.goles===max?"top":""}"><span class="gp">${i+1}</span><span class="gn">${esc(j.nombre)}${j.goles===max?' <em>Pichichi</em>':""}</span><span class="gb"><i style="width:${(j.goles/max*100).toFixed(0)}%"></i></span><b>${j.goles}</b></li>`).join("")}</ol>`;
}
function renderGolesAdmin(){
  if(!GOLES)return `<p class="note">${esc(golErr||"Cargando goleadores…")}</p>`;
  const total=GOLES.jugadores.reduce((s,j)=>s+(+j.goles||0),0),gf=stats().me.gf;
  return `<form class="box" id="golesForm"><div class="jhead"><h3>Goleadores</h3><span class="label">Total ${total} · goles del equipo en liga ${gf}</span></div>
    ${total!==gf?`<p class="note" style="color:var(--loss)">La suma de goles (${total}) no coincide con los goles a favor de la clasificación (${gf}).</p>`:""}
    <div class="gedit">${GOLES.jugadores.map((j,i)=>`<label class="grow" for="g-${i}"><span>${esc(j.nombre)}</span><input type="number" min="0" id="g-${i}" value="${+j.goles||0}"></label>`).join("")}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center"><button class="btn" ${saving?"disabled":""}>${saving?"Guardando…":"Guardar goleadores"}</button>
    <span class="note">Se ven en Inicio 1–2 minutos después de guardar.</span></div></form>`;
}

async function verify(){
  const r=await fetch(API,{headers:hdr(),cache:"no-store"});
  if(!r.ok)return false;const j=await r.json();return !!(j.permissions&&j.permissions.push);
}
async function saveData(msg){
  const g=await fetch(API+"/contents/"+DPATH,{headers:hdr(),cache:"no-store"});
  if(!g.ok)throw new Error("No se pudo leer el archivo ("+g.status+")");
  const cur=await g.json();
  const r=await fetch(API+"/contents/"+DPATH,{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify({message:msg,content:b64(JSON.stringify(DATA,null,1)+"\n"),sha:cur.sha})});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message}catch(e){}throw new Error("GitHub rechazó el guardado: "+m)}
}

// ---------- Gestión económica: data/economia.json, solo se lee y se escribe con la clave ----------
const EPATH="data/economia.json";
let ECO=null,ecoSha=null,ecoErr="",ecoBusy=false;
const eur=n=>n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
const r2=n=>Math.round(n*100)/100;
async function loadEco(){
  ecoErr="";
  const r=await fetch(API+"/contents/"+EPATH,{headers:hdr(),cache:"no-store"});
  if(!r.ok){ECO=null;ecoErr=r.status===404?"Todavía no existe data/economia.json en el repositorio.":"No se pudo leer la economía ("+r.status+").";return}
  const j=await r.json();ecoSha=j.sha;
  const bin=atob(j.content.replace(/\n/g,""));ECO=JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))));
}
async function saveEco(msg){
  const r=await fetch(API+"/contents/"+EPATH,{method:"PUT",headers:hdr({"Content-Type":"application/json"}),body:JSON.stringify({message:msg,content:b64(JSON.stringify(ECO,null,1)+"\n"),sha:ecoSha})});
  if(!r.ok){let m=r.status;try{m=(await r.json()).message}catch(e){}throw new Error("GitHub rechazó el guardado: "+m)}
  ecoSha=(await r.json()).content.sha;
}
function renderEco(){
  if(!ECO)return `<p class="note">${esc(ecoErr||"Cargando la economía…")}</p>`;
  const js=ECO.jugadores,n=js.length,cuota=r2(ECO.arbitros/n),pagador=ECO.pagadorArbitros||"",pagados=js.filter(j=>j.arbitros||j.nombre===pagador).length;
  const cobrado=r2(pagados*cuota),pendiente=r2(ECO.arbitros-cobrado),caja=r2(ECO.premio-ECO.inscripcion-ECO.fianza);
  return `<div class="kpis">
    <div class="kpi"><span class="label">Queda en caja</span><span class="v y">${eur(caja)}</span><span class="s">Premio ${eur(ECO.premio)} − inscripción y fianza</span></div>
    <div class="kpi"><span class="label">Árbitros cobrados</span><span class="v ok">${eur(cobrado)}</span><span class="s">${pagados} de ${n} jugadores${pagador?` (contando a ${esc(pagador)})`:""}</span></div>
    <div class="kpi"><span class="label">Árbitros pendiente</span><span class="v ${pendiente>0?"ko":"ok"}">${eur(pendiente)}</span><span class="s">${n-pagados} por pagar · ${eur(cuota)} cada uno${pagador?` a ${esc(pagador)}`:""}</span></div>
  </div>
  <div class="grid2" style="margin-top:0">
    <section class="box"><div class="jhead"><h3>Caja del equipo</h3><span class="label">Movimientos</span></div>
      <table class="ledger"><tbody>
        <tr><td>Premio ganado<span class="src">Entrada en caja</span></td><td class="amt in">+${eur(ECO.premio)}</td></tr>
        <tr><td>Inscripción en la liga<span class="src">Pagado con la caja</span></td><td class="amt out">−${eur(ECO.inscripcion)}</td></tr>
        <tr><td>Fianza<span class="src">Pagado con la caja · se devuelve al acabar la liga</span></td><td class="amt out">−${eur(ECO.fianza)}</td></tr>
        <tr class="tot"><td>Queda en caja</td><td class="amt">${eur(caja)}</td></tr>
      </tbody></table>
      <p class="note" style="margin-top:14px">Inscripción y fianza suman ${eur(r2(ECO.inscripcion+ECO.fianza))}.</p>
    </section>
    <section class="box"><div class="jhead"><h3>Pago de árbitros</h3><span class="label">${eur(ECO.arbitros)} ÷ ${n} = ${eur(cuota)}</span></div>
      <p class="note">${pagador?`Los ${eur(ECO.arbitros)} de los árbitros los ha adelantado <b>${esc(pagador)}</b>. Cada uno de los demás le debe ${eur(cuota)}: márcalo cuando se lo devuelva.`:`Marca a cada jugador cuando pague su parte de ${eur(cuota)}.`}</p>
      <div class="bar" role="img" aria-label="${pagados} de ${n} pagados"><i style="width:${(pagados/n*100).toFixed(1)}%"></i></div>
      <div>${js.map((j,i)=>j.nombre===pagador?`<div class="prow"><span class="ix">${i+1}</span><span class="nm">${esc(j.nombre)}</span><span class="payer${pendiente<=0?" done":""}"><b>${pendiente<=0?"Recuperado":"Le deben "+eur(pendiente)}</b><span>Adelantó ${eur(ECO.arbitros)} · recuperado ${eur(r2(ECO.arbitros-cuota-pendiente))}</span></span></div>`:`<div class="prow"><span class="ix">${i+1}</span><span class="nm">${esc(j.nombre)}</span>
        <label class="paychk${j.arbitros?" paid":""}" for="pg-${i}"><input type="checkbox" id="pg-${i}" data-pago="${i}" ${j.arbitros?"checked":""} ${ecoBusy?"disabled":""}> ${j.arbitros?"Pagado":"Pendiente"}</label></div>`).join("")}</div>
      <p class="note" style="margin-top:12px">${ecoBusy?"Guardando…":"Cada marca se guarda en el repositorio al momento."}</p>
    </section>
  </div>`;
}

function row(m){
  const ours=m.h===US||m.a===US;
  const sc=m.post?`<div class="score pend"><span class="tag">Aplaz.</span></div>`:played(m)?`<div class="score">${m.hg}–${m.ag}</div>`:`<div class="score pend">${m.time}</div>`;
  return `<div class="mrow${ours?" ours":""}">
    <div class="when"><b>${fmt(m.date)}</b>${m.time} h</div>
    <div class="h${m.h===US?" ours-name":""}" title="${esc(T[m.h])}">${tm(m.h,SHORT[m.h])}${camiseta(m.h,1)}</div>${sc}
    <div class="a${m.a===US?" ours-name":""}" title="${esc(T[m.a])}">${tm(m.a,SHORT[m.a])}${camiseta(m.a,1)}</div></div>`;
}
function table(){
  const S={};Object.keys(T).forEach(k=>S[k]={k,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0,form:[]});
  M().filter(played).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(m=>{
    const h=S[m.h],a=S[m.a],hg=+m.hg,ag=+m.ag;
    h.pj++;a.pj++;h.gf+=hg;h.gc+=ag;a.gf+=ag;a.gc+=hg;
    if(hg>ag){h.g++;a.p++;h.pts+=3;h.form.push("W");a.form.push("L")}
    else if(hg<ag){a.g++;h.p++;a.pts+=3;a.form.push("W");h.form.push("L")}
    else{h.e++;a.e++;h.pts++;a.pts++;h.form.push("D");a.form.push("D")}
  });
  return Object.values(S).sort((x,y)=>y.pts-x.pts||(y.gf-y.gc)-(x.gf-x.gc)||y.gf-x.gf||T[x.k].localeCompare(T[y.k]));
}
function tableHTML(rows,compact){
  return `<div class="tscroll"><table class="${compact?"compact":""}"><thead><tr><th>#</th><th class="l">Equipo</th><th>PJ</th>${compact?"":"<th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th>"}<th>DG</th><th>Pts</th>${compact?"":"<th>Últimos 5</th>"}</tr></thead><tbody>${
  rows.map((r,i)=>`<tr class="${[r.k===US?"ours":"",i===0&&r.pts>0?"lead":""].join(" ")}"><td class="pos">${i+1}</td><td class="l">${tm(r.k)}</td><td>${r.pj}</td>${compact?"":`<td>${r.g}</td><td>${r.e}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gc}</td>`}<td>${r.gf-r.gc>0?"+":""}${r.gf-r.gc}</td><td class="pts">${r.pts}</td>${compact?"":`<td><div class="form">${r.form.slice(-5).map(f=>`<i class="${f}">${{W:"G",D:"E",L:"P"}[f]}</i>`).join("")||'<span class="label">—</span>'}</div></td>`}</tr>`).join("")}</tbody></table></div>`;
}

function cuentaAtras(m){
  const ms=new Date(`${m.date}T${m.time}:00`)-Date.now();
  if(ms<=0)return `<div><b>HOY</b><span>a por ellos</span></div>`;
  const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4);
  return `<div><b>${d}</b><span>${d===1?"día":"días"}</span></div><div><b>${h}</b><span>horas</span></div><div><b>${mi}</b><span>min</span></div>`;
}
function stats(){
  const t=table(),pos=t.findIndex(r=>r.k===US)+1,me=t[pos-1];
  return {pos,me,racha:me.form.slice(-5)};
}
function card(m){
  const us=m.h===US?"h":"a",side=k=>`<div class="mc-t${k===US?" us":""}" title="${esc(T[k])}">${badge(k)}<span>${esc(SHORT[k]||T[k])}</span>${camiseta(k)}</div>`;
  let cls="next",mid=`<span class="mc-sc t">${m.time}</span>`,pill=`<span class="res N">${m.post?"Aplazado":m.h===US?"En casa":"Fuera"}</span>`;
  if(played(m)){
    const a=us==="h"?+m.hg:+m.ag,b=us==="h"?+m.ag:+m.hg;cls=a>b?"W":a<b?"L":"D";
    mid=`<span class="mc-sc">${m.hg}–${m.ag}</span>`;pill=`<span class="res ${cls}">${{W:"Victoria",D:"Empate",L:"Derrota"}[cls]}</span>`;
  }
  return `<article class="mc ${cls}"><div class="mc-top"><span class="label">J${m.j} · ${fmt(m.date)}</span>${pill}</div><div class="mc-ln">${side(m.h)}${mid}${side(m.a)}</div></article>`;
}
function renderInicio(){
  const all=M(),ours=all.filter(m=>m.h===US||m.a===US).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const t=todayISO();
  const next=ours.find(m=>!played(m)&&!m.post&&m.date>=t)||ours.find(m=>!played(m));
  const done=ours.filter(played);
  let nx="";
  if(next){
    const side=k=>`<div class="md-team${k===US?" us":""}">${badge(k)}<b>${esc(T[k])}</b>${camiseta(k)}<small>${k===next.h?"Local":"Visitante"}</small></div>`;
    nx=`<section class="matchday" aria-label="Próximo partido"><div class="md-top"><span class="label">Próximo partido</span><span class="label">Jornada ${next.j} · 3ª División</span></div>
      <div class="md-teams">${side(next.h)}<div class="md-mid"><span class="md-date">${fmt(next.date,{weekday:"short",day:"numeric",month:"short"})}</span><span class="md-time">${next.time}</span><span class="md-vs">VS</span></div>${side(next.a)}</div>
      <div class="md-count" id="cd">${cuentaAtras(next)}</div></section>`;
  }
  const {pos,me,racha}=stats(),dg=me.gf-me.gc;
  const proximos=ours.filter(m=>!played(m)&&m!==next).slice(0,3);
  return `<div class="tab">${nx}
  <div class="sech"><h2 class="sec">La temporada</h2><span class="label">${me.pj} partido${me.pj===1?"":"s"} jugado${me.pj===1?"":"s"}</span></div>
  <div class="season">
    <div><b style="color:var(--yellow)">${pos}º</b><span>Puesto</span></div>
    <div><b>${me.pts}</b><span>Puntos</span></div>
    <div><b>${me.g}-${me.e}-${me.p}</b><span>G-E-P</span></div>
    <div><b style="color:var(--win)">${me.gf}</b><span>Goles a favor</span></div>
    <div><b style="color:${dg<0?"var(--loss)":"var(--text)"}">${dg>0?"+":""}${dg}</b><span>Diferencia</span></div>
    <div><div class="form">${racha.map(f=>`<i class="${f}">${{W:"G",D:"E",L:"P"}[f]}</i>`).join("")||"—"}</div><span>Racha</span></div>
  </div>
  <div class="cols">
    <section><div class="sech"><h2 class="sec">Resultados</h2><button class="btn ghost" data-go="calendario" style="padding:8px 10px;font-size:13px">Calendario</button></div>
      ${done.length?`<div class="cards">${done.slice(-4).reverse().map(card).join("")}</div>`:`<p class="empty-note">Aún no hemos jugado ningún partido.</p>`}</section>
    <section><div class="sech"><h2 class="sec">Próximos partidos</h2></div>
      ${proximos.length?`<div class="cards">${proximos.map(card).join("")}</div>`:`<p class="empty-note">No quedan más partidos en el calendario.</p>`}</section>
  </div>
  <div class="cols">
    <section><div class="sech"><h2 class="sec">Clasificación</h2><button class="btn ghost" data-go="clasificacion" style="padding:8px 10px;font-size:13px">Ver completa</button></div>
      <div class="box">${tableHTML(table(),true)}</div></section>
    <section><div class="sech"><h2 class="sec">Goleadores</h2><span class="label">Liga 2026/27</span></div>
      ${goleadoresHTML()||'<p class="empty-note">Cargando goleadores…</p>'}</section>
  </div></div>`;
}
const SHORT={CRA:"Cracks Minutti",QUI:"Quinta Fase",ROY:"Royal Academy",MAS:"Mashuca",SIT:"CD Sitivo",HAR:"Harta Fe",GAL:"Barrio Galaxy",NAS:"La Nasa",SLC:"La Caleta",VIV:"Vividores",BOM:"La Bomba",DIS:"Club Disney"};
const MONTHS=["2026-10","2026-11","2026-12","2027-01","2027-02","2027-03","2027-04","2027-05"];
let calView="mes",calMonth=null,selDay=null;
const breakOn=iso=>BREAK_R.find(r=>iso>=r.from&&iso<=r.to);
const ourNext=()=>{const t=todayISO();return M().filter(m=>(m.h===US||m.a===US)&&!played(m)).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).find(m=>m.date>=t)};
function defaultDay(month){
  const n=ourNext();if(n&&n.date.startsWith(month))return n.date;
  const ds=M().filter(m=>m.date.startsWith(month)&&(!filterOurs||m.h===US||m.a===US)).map(m=>m.date).sort();
  return ds[0]||null;
}
function calBar(){
  return `<div class="toolbar"><h2 style="margin:0;margin-right:auto">Calendario</h2>
    <div class="seg" role="group" aria-label="Vista"><button data-view="mes" aria-pressed="${calView==="mes"}">Mes</button><button data-view="lista" aria-pressed="${calView==="lista"}">Lista</button></div>
    <label class="chk"><input type="checkbox" id="fOurs" ${filterOurs?"checked":""}> Solo Sporting La Caleta</label></div>`;
}
function renderCal(){return calView==="mes"?renderMonth():renderList()}
function renderMonth(){
  if(!calMonth){const n=ourNext();const t=todayISO().slice(0,7);calMonth=n?n.date.slice(0,7):(MONTHS.includes(t)?t:MONTHS[0])}
  if(selDay===null||!selDay.startsWith(calMonth))selDay=defaultDay(calMonth);
  const [y,mo]=calMonth.split("-").map(Number);
  const lead=(new Date(Date.UTC(y,mo-1,1)).getUTCDay()+6)%7, dim=new Date(Date.UTC(y,mo,0)).getUTCDate();
  const all=M(),t=todayISO(),idx=MONTHS.indexOf(calMonth);
  const byDay={};all.forEach(m=>(byDay[m.date]=byDay[m.date]||[]).push(m));
  const title=new Date(Date.UTC(y,mo-1,15)).toLocaleDateString("es-ES",{month:"long",year:"numeric",timeZone:"UTC"});
  let cells="";
  for(let i=0;i<lead;i++)cells+=`<div class="day empty" aria-hidden="true"></div>`;
  for(let d=1;d<=dim;d++){
    const iso=`${calMonth}-${String(d).padStart(2,"0")}`,ms=(byDay[iso]||[]).sort((a,b)=>a.time.localeCompare(b.time));
    const ours=ms.find(m=>m.h===US||m.a===US),others=ms.filter(m=>m!==ours),br=breakOn(iso);
    const dow=(lead+d-1)%7;
    let inner=`<span class="n">${d}</span>`;
    if(ours){
      const opp=ours.h===US?ours.a:ours.h,home=ours.h===US;
      let res=ours.post?"Aplazado":ours.time;
      if(played(ours)){const us=home?+ours.hg:+ours.ag,th=home?+ours.ag:+ours.hg;res=`${ours.hg}–${ours.ag} <b class="rs ${us>th?"W":us<th?"L":"D"}">${us>th?"G":us<th?"P":"E"}</b>`}
      inner+=`<span class="chip"><span class="opp">${home?"vs":"en"} ${esc(SHORT[opp])}</span><span class="ct">${res}</span></span>`;
    }
    if(others.length&&!filterOurs)inner+=`<span class="dots" title="${others.length} partidos más">${others.map(()=>"<i></i>").join("")}<em>${ours?"+":""}${others.length} partido${others.length>1?"s":""}</em></span>`;
    if(br&&(d===1||iso===br.from||dow===0))inner+=`<span class="blab">${br.t}</span>`;
    const cls=["day",dow>=5?"wknd":"",br?"brk-day":"",iso===t?"today":"",iso===selDay?"sel":"",ours?"has-ours":""].join(" ");
    cells+=`<button class="${cls}" data-day="${iso}" aria-label="${fmt(iso,{weekday:"long",day:"numeric",month:"long"})}${ours?", juega Sporting La Caleta":""}${ms.length?`, ${ms.length} partidos`:""}">${inner}</button>`;
  }
  const tail=(7-(lead+dim)%7)%7;for(let i=0;i<tail;i++)cells+=`<div class="day empty" aria-hidden="true"></div>`;
  let detail="";
  if(selDay){
    const ds=(byDay[selDay]||[]).filter(m=>!filterOurs||m.h===US||m.a===US).sort((a,b)=>a.time.localeCompare(b.time)),br=breakOn(selDay);
    detail=`<section class="box" style="margin-top:16px"><div class="jhead"><h3>${fmt(selDay,{weekday:"long",day:"numeric",month:"long"})}</h3>${ds.length?`<span class="label">Jornada ${ds[0].j}</span>`:""}</div>
      ${ds.length?ds.map(row).join(""):`<p class="note">${br?`Sin partidos: ${br.t.toLowerCase()==="recuperación"?"semana de recuperación y descanso":"descanso de "+br.t}.`:"No hay partidos este día."}</p>`}</section>`;
  }
  const monthOurs=all.filter(m=>m.date.startsWith(calMonth)&&(m.h===US||m.a===US)).length;
  return `<div class="tab">${calBar()}
    <div class="mhead"><button class="btn ghost nav-m" data-mon="-1" ${idx<=0?"disabled":""} aria-label="Mes anterior">‹</button>
      <div style="text-align:center"><h3 class="mtitle">${title}</h3><span class="label">${monthOurs?`${monthOurs} partido${monthOurs>1?"s":""} de La Caleta`:"Sin partidos de La Caleta"}</span></div>
      <button class="btn ghost nav-m" data-mon="1" ${idx>=MONTHS.length-1?"disabled":""} aria-label="Mes siguiente">›</button></div>
    <div class="mgrid">${["L","M","X","J","V","S","D"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>
    <div class="mlegend"><span><i class="lg-chip"></i>Partido de La Caleta</span><span><i class="lg-dot"></i>Otros partidos</span><span><i class="lg-brk"></i>Descanso</span></div>
    ${detail}</div>`;
}
function renderList(){
  const all=M();let h=`<div class="tab">${calBar()}`;
  for(let j=1;j<=22;j++){
    let ms=all.filter(m=>m.j===j).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
    const done=ms.every(played);
    if(filterOurs)ms=ms.filter(m=>m.h===US||m.a===US);
    if(j===12)h+=`<h2 style="margin-top:28px">Segunda vuelta</h2>`;
    h+=`<section class="jcard${done?" done":""}"><div class="jhead"><h3>Jornada ${j}</h3><span class="label">${fmt(STARTS[j-1],{day:"numeric",month:"short"})} – ${fmt(addDays(STARTS[j-1],3),{day:"numeric",month:"short",year:"numeric"})}</span></div>${ms.map(row).join("")}</section>`;
    BREAKS().filter(b=>b.after===j).forEach(b=>h+=`<div class="brk">${b.t}</div>`);
  }
  return h+`<p class="note">Fechas según el calendario oficial del Ayuntamiento de Tomares. La organización puede modificarlas.</p></div>`;
}
function renderClas(){
  return `<div class="tab"><h2 class="sec">Clasificación</h2><div class="box">${tableHTML(table(),false)}</div>
  <p class="legend">Victoria 3 pts · Empate 1 · Derrota 0. Desempate por diferencia de goles y goles a favor.</p></div>`;
}
function renderAdmin(){
  if(!authed) return `<div class="tab"><h2>Zona privada</h2><form class="login" id="login">
    <p class="note">Entra con tu clave de acceso de GitHub. Solo quien tenga permiso de escritura en el repositorio puede cambiar partidos y resultados.</p>
    <label class="label" for="pw">Clave de acceso (token de GitHub)</label><input type="password" id="pw" autocomplete="current-password" value="${esc(token||"")}">
    <label class="chk" style="font-size:14px"><input type="checkbox" id="remember" checked> Recordar en este dispositivo</label>
    <button class="btn" ${saving?"disabled":""}>${saving?"Comprobando…":"Entrar"}</button><div class="err" ${loginErr?"":"hidden"}>${esc(loginErr)}</div></form></div>`;
  const sub=`<div class="toolbar subnav"><h2 style="margin:0;margin-right:auto">Zona privada</h2>
    <div class="seg" role="group" aria-label="Sección"><button data-aview="partidos" aria-pressed="${adminView==="partidos"}">Partidos</button><button data-aview="goles" aria-pressed="${adminView==="goles"}">Goleadores</button><button data-aview="eco" aria-pressed="${adminView==="eco"}">Gestión económica</button></div>
    <button class="btn ghost" id="logout">Salir</button></div>`;
  if(adminView==="eco")return `<div class="tab">${sub}${renderEco()}</div>`;
  if(adminView==="goles")return `<div class="tab">${sub}${renderGolesAdmin()}</div>`;
  const all=M();
  if(adminJ===null){const p=all.find(m=>!played(m)&&!m.post);adminJ=p?p.j:22}
  const ms=all.filter(m=>m.j===adminJ);
  return `<div class="tab">${sub}<div class="toolbar"><h3 style="margin:0;margin-right:auto">Editar partidos</h3>
    <select id="selJ" aria-label="Jornada">${STARTS.map((_,i)=>`<option value="${i+1}" ${i+1===adminJ?"selected":""}>Jornada ${i+1}</option>`).join("")}</select></div>
  <form class="box" id="edit">${ms.map(m=>`<div class="arow"><div class="teams">${esc(T[m.h])} <span class="label">vs</span> ${esc(T[m.a])}</div>
    <div class="fields"><input type="date" id="d-${m.id}" value="${m.date}" aria-label="Fecha"><input type="time" id="t-${m.id}" value="${m.time}" aria-label="Hora">
    <input type="number" min="0" id="h-${m.id}" value="${m.hg??""}" placeholder="–" aria-label="Goles local"><input type="number" min="0" id="a-${m.id}" value="${m.ag??""}" placeholder="–" aria-label="Goles visitante">
    <label class="chk" style="font-size:13px"><input type="checkbox" id="p-${m.id}" ${m.post?"checked":""}> Aplazado</label></div></div>`).join("")}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center"><button class="btn" ${saving?"disabled":""}>${saving?"Guardando…":"Guardar jornada "+adminJ}</button>
    <span class="note">Deja los goles vacíos si el partido no se ha jugado. La web pública se actualiza 1–2 minutos después de guardar.</span></div></form></div>`;
}
const VIEWS={inicio:renderInicio,calendario:renderCal,clasificacion:renderClas,admin:renderAdmin};
let tab="inicio";
try{const h=location.hash.slice(1);if(VIEWS[h])tab=h}catch(e){}
function render(){
  document.querySelectorAll("nav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  document.getElementById("main").innerHTML=VIEWS[tab]();
}
setInterval(()=>{const cd=document.getElementById("cd");if(!cd||!DATA)return;const t=todayISO(),n=M().filter(m=>(m.h===US||m.a===US)&&!played(m)&&!m.post&&m.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];if(n)cd.innerHTML=cuentaAtras(n)},30000);
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab],[data-go]");
  if(b){tab=b.dataset.tab||b.dataset.go;render();window.scrollTo(0,0);return}
  const v=e.target.closest("[data-view]");if(v){calView=v.dataset.view;render();return}
  const av=e.target.closest("[data-aview]");if(av){adminView=av.dataset.aview;render();if(adminView==="eco")loadEco().catch(err=>{ecoErr=err.message}).then(render);if(adminView==="goles")loadGolesAdmin().then(render);return}
  const mn=e.target.closest("[data-mon]");if(mn&&!mn.disabled){calMonth=MONTHS[MONTHS.indexOf(calMonth)+ +mn.dataset.mon];selDay=null;render();return}
  const dy=e.target.closest("[data-day]");if(dy){selDay=dy.dataset.day;render();return}
  if(e.target.id==="logout"){authed=false;ECO=null;token=null;try{localStorage.removeItem("slc-token")}catch(_){}render()}
});
document.addEventListener("change",e=>{
  if(e.target.id==="fOurs"){filterOurs=e.target.checked;selDay=null;render()}
  if(e.target.id==="selJ"){adminJ=+e.target.value;render()}
  if(e.target.dataset&&e.target.dataset.pago!==undefined&&ECO&&!ecoBusy)marcaPago(+e.target.dataset.pago,e.target.checked);
});
async function marcaPago(i,valor){
  const j=ECO.jugadores[i];j.arbitros=valor;ecoBusy=true;render();
  try{await saveEco(`Árbitros: ${j.nombre} ${valor?"ha pagado":"pendiente"}`);toast(`${j.nombre}: ${valor?"pagado":"pendiente"}`)}
  catch(err){j.arbitros=!valor;toast(err.message);try{await loadEco()}catch(_){}}
  ecoBusy=false;render();
}
document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(saving)return;
  if(e.target.id==="login"){
    token=document.getElementById("pw").value.trim();const rem=document.getElementById("remember").checked;
    saving=true;loginErr="";render();
    try{
      if(!token||!(await verify()))throw new Error("La clave no es válida o no tiene permiso para escribir en el repositorio.");
      await load(true);authed=true;
      try{rem?localStorage.setItem("slc-token",token):localStorage.removeItem("slc-token")}catch(_){}
    }catch(err){loginErr=err.message}
    saving=false;render();
  }
  if(e.target.id==="golesForm"){
    const prev=JSON.stringify(GOLES);
    GOLES.jugadores.forEach((j,i)=>{const v=document.getElementById("g-"+i).value;j.goles=Math.max(0,+v||0)});
    saving=true;render();
    try{golSha=await apiPut(GPATH,GOLES,golSha,"Goleadores: actualizar");toast("Goleadores guardados")}
    catch(err){GOLES=JSON.parse(prev);toast(err.message);await loadGolesAdmin()}
    saving=false;render();
  }
  if(e.target.id==="edit"){
    const ms=M().filter(m=>m.j===adminJ),prev=JSON.stringify(ms);
    ms.forEach(m=>{
      const v=k=>document.getElementById(`${k}-${m.id}`).value;
      const hg=v("h"),ag=v("a");
      Object.assign(m,{date:v("d")||m.date,time:v("t")||m.time,hg:hg===""?null:+hg,ag:ag===""?null:+ag,post:document.getElementById(`p-${m.id}`).checked});
    });
    saving=true;render();
    try{await saveData(`Jornada ${adminJ}: actualizar partidos y resultados`);toast(`Jornada ${adminJ} guardada`)}
    catch(err){JSON.parse(prev).forEach(o=>Object.assign(MATCHES.find(m=>m.id===o.id),o));toast(err.message)}
    saving=false;render();
  }
});
document.getElementById("main").innerHTML=`<p class="note">Cargando calendario…</p>`;
Promise.all([load(false),loadGolesPublico()]).then(render).catch(()=>{document.getElementById("main").innerHTML=`<p class="note">No se pudo cargar el calendario. Recarga la página en unos segundos.</p>`});
</script>
